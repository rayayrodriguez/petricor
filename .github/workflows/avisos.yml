name: Avisos y observación

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/avisos.yml"]

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: scripts/datos.sh preparar
      - name: Avisos, observación y notificaciones
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          PUSH_CONFIG_2: ${{ secrets.PUSH_CONFIG_2 }}
          PUSH_CONFIG_3: ${{ secrets.PUSH_CONFIG_3 }}
          PETRICOR_DATOS: ${{ github.workspace }}/datos
        run: python avisos.py
        working-directory: scripts
      - run: scripts/datos.sh guardar "Avisos y observación"
