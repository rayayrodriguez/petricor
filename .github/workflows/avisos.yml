name: Avisos y observación

on:
  schedule:
    # Minutos desplazados: a las en punto GitHub va más cargado y retrasa o salta ejecuciones
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/avisos.yml", "prevision.js"]

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: scripts/datos.sh preparar
      # GitHub no lanza bien las tareas diarias programadas: si las correcciones tienen más de 20 horas, se recalculan aquí
      - name: Correcciones, si toca
        env:
          PETRICOR_DATOS: ${{ github.workspace }}/datos
        working-directory: scripts
        run: |
          if python toca_correcciones.py; then
            python correcciones.py || echo "Correcciones no actualizadas"
          fi
      - name: Previsión del día para el historial de aciertos
        env:
          PETRICOR_DATOS: ${{ github.workspace }}/datos
        run: node scripts/prevision_diaria.mjs || echo "Previsión del día no guardada"
      - name: Avisos, observación y notificaciones
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          PUSH_CONFIG_2: ${{ secrets.PUSH_CONFIG_2 }}
          PUSH_CONFIG_3: ${{ secrets.PUSH_CONFIG_3 }}
          PETRICOR_DATOS: ${{ github.workspace }}/datos
        run: python avisos.py
        working-directory: scripts
      - run: scripts/datos.sh guardar "Avisos y observación"
